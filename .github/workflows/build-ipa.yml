name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project CaptureView.xcodeproj \
            -scheme CaptureView \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || true

          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "编译成功"
            exit 0
          fi

          echo "::error::编译失败，下面是报错行"
          grep -E "(error|Error): " build.log | grep -v "note:" | head -n 15 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 60 build.log
          exit 1

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CaptureView.app Payload/
          zip -r CaptureView.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CaptureView-ipa
          path: CaptureView.ipa
          if-no-files-found: error
